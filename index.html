<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A JavaScript task management application with CRUD operations, filtering and local storage.">

    <meta name="author"
          content="Bhavana N">

    <title>TaskFlow | To-Do Application</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <header class="app-header">

        <div class="container">

            <div class="brand">

                <div class="brand-icon" aria-hidden="true">
                    ✓
                </div>

                <div>
                    <h1>TaskFlow</h1>
                    <p>Smart task management</p>
                </div>

            </div>

        </div>

    </header>


    <main class="container">

        <section class="todo-app"
                 aria-labelledby="app-title">

            <div class="intro">

                <p class="eyebrow">
                    JavaScript Task Manager
                </p>

                <h2 id="app-title">
                    Organize your day
                </h2>

                <p>
                    Add, edit, complete and manage your tasks.
                    Your tasks are automatically saved in your browser.
                </p>

            </div>


            <!-- Add task form -->

            <form id="task-form"
                  class="task-form">

                <label for="task-input">
                    Add a new task
                </label>

                <div class="input-row">

                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="What needs to be done?"
                        maxlength="200"
                        autocomplete="off"
                        required>

                    <button
                        type="submit"
                        class="primary-button">
                        Add Task
                    </button>

                </div>

            </form>


            <!-- Status -->

            <div class="task-summary"
                 aria-live="polite">

                <p>
                    <strong id="task-count">0</strong>
                    <span id="task-label">tasks</span>
                </p>

                <button
                    type="button"
                    id="clear-completed"
                    class="text-button">
                    Clear completed
                </button>

            </div>


            <!-- Filters -->

            <nav class="filters"
                 aria-label="Task filters">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                    aria-pressed="true">
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="active"
                    aria-pressed="false">
                    Active
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                    aria-pressed="false">
                    Completed
                </button>

            </nav>


            <!-- Task list -->

            <section aria-labelledby="task-list-title">

                <h3 id="task-list-title"
                    class="visually-hidden">
                    Your tasks
                </h3>

                <ul id="task-list"
                    class="task-list"
                    aria-live="polite">
                </ul>

                <p id="empty-state"
                   class="empty-state">

                    No tasks yet. Add your first task above!

                </p>

            </section>

        </section>

    </main>


    <footer class="app-footer">

        <div class="container">

            <p>
                Built with HTML5, CSS3 and JavaScript.
            </p>

            <a href="">
               
            </a>

        </div>

    </footer>

</body>
</html>
